<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>AR Business Card</title>

<!-- AR engine: A-Frame (3D) + MindAR (image tracking) -->
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
</style>
</head>
<body>

<!--
  imageTargetSrc points at MindAR's own demo card so this works the moment you
  open it. Once you've compiled a target from YOUR card (see README), change
  this line to: imageTargetSrc: ./targets.mind;
-->
<a-scene
  mindar-image="imageTargetSrc: ./targets.mind;"
  color-space="sRGB"
  renderer="colorManagement: true, physicallyCorrectLights"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
>
  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <!-- everything inside here is locked to the card and only appears once it's detected -->
  <a-entity mindar-image-target="targetIndex: 0">

    <!-- top-right badge, sits just above the card -->
    <a-entity position="0.22 0.34 0.02">
      <a-plane color="#000000" height="0.075" width="0.5"></a-plane>
      <a-text value="FUTURE MUG  ·  TRUSTED EVALUATION PARTNER" align="center" color="#ffffff"
        width="0.95" position="0 0 0.001"></a-text>
    </a-entity>

    <!-- vertical name tag, just off the left edge of the card -->
    <a-entity position="-0.63 0.02 0.02" rotation="0 0 90">
      <a-plane color="#000000" height="0.6" width="0.15"></a-plane>
      <a-text value="SATHYA NAIR" align="center" color="#ffffff" width="1.4" position="0 0 0.001"></a-text>
    </a-entity>

    <!-- vertical title tag, just to the left of the name tag -->
    <a-entity position="-0.47 0.02 0.02" rotation="0 0 90">
      <a-plane color="#000000" height="0.42" width="0.1"></a-plane>
      <a-text value="SENIOR CONSULTANT" align="center" color="#ffffff" width="1" position="0 0 0.001"></a-text>
    </a-entity>

  </a-entity>
</a-scene>

</body>
</html>
