<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>AR Business Card</title>

<!-- AR engine: A-Frame (3D) + MindAR (image tracking) -->
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">

<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: 'Inter', system-ui, sans-serif; }

  /* corner-bracket viewfinder, purely decorative */
  #frame { position: fixed; inset: 0; z-index: 5; pointer-events: none; }
  #frame span {
    position: absolute; width: 26px; height: 26px; border: 2px solid rgba(34,211,238,0.85);
  }
  #frame .tl { top: 18px; left: 18px; border-right: none; border-bottom: none; }
  #frame .tr { top: 18px; right: 18px; border-left: none; border-bottom: none; }
  #frame .bl { bottom: 90px; left: 18px; border-right: none; border-top: none; }
  #frame .br { bottom: 90px; right: 18px; border-left: none; border-top: none; }

  #hint {
    position: fixed; top: 28px; left: 0; right: 0; text-align: center; z-index: 10;
    color: #22D3EE; font-family: 'Orbitron', sans-serif; font-weight: 600;
    font-size: 11px; letter-spacing: 3px; text-shadow: 0 0 8px rgba(34,211,238,0.6);
  }

  #contact-bar {
    position: fixed; left: 12px; right: 12px; bottom: 16px; z-index: 10;
    display: flex; justify-content: space-between; gap: 8px;
    padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
    background: rgba(11,18,32,0.75); border: 1px solid rgba(34,211,238,0.35);
    border-radius: 18px; backdrop-filter: blur(10px);
    box-shadow: 0 0 20px rgba(34,211,238,0.15);
  }
  #contact-bar a {
    flex: 1; color: #fff; text-decoration: none; text-align: center;
    font-family: 'Orbitron', sans-serif; font-size: 10px; font-weight: 600; letter-spacing: 1px;
    background: rgba(34,211,238,0.08); padding: 10px 6px; border-radius: 12px;
    border: 1px solid rgba(34,211,238,0.25);
  }
</style>
</head>
<body>

<div id="frame"><span class="tl"></span><span class="tr"></span><span class="bl"></span><span class="br"></span></div>
<div id="hint">SCAN THE CARD</div>

<!--
  imageTargetSrc points at MindAR's own demo card so this works the moment you
  open it. Once you've compiled a target from YOUR card (see README), change
  this line to: imageTargetSrc: ./targets.mind;
-->
<a-scene
  mindar-image="imageTargetSrc: ./targets.mind;"
  color-space="sRGB"
  renderer="colorManagement: true, physicallyCorrectLights"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
>
  <a-assets>
    <a-mixin id="cube"
      geometry="primitive: box; depth: 0.018; height: 0.018; width: 0.018"
      material="color: #22D3EE; emissive: #22D3EE; emissiveIntensity: 0.7; shader: standard; metalness: 0.3; roughness: 0.2">
    </a-mixin>
  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <a-entity mindar-image-target="targetIndex: 0">

    <!-- rotating halo ring -->
    <a-ring color="#22D3EE" radius-inner="0.335" radius-outer="0.34" opacity="0.55"
      position="0 0 -0.03"
      animation="property: rotation; to: 0 0 360; dur: 8000; loop: true; easing: linear"></a-ring>

    <!-- dark glass panel -->
    <a-plane color="#0B1220" opacity="0.78" height="0.46" width="1.02" position="0 0 -0.02"></a-plane>
    <!-- neon top accent line -->
    <a-plane color="#22D3EE" height="0.012" width="1.02" position="0 0.21 -0.015"></a-plane>

    <!-- name -->
    <a-text value="SATHYA NAIR" align="center" color="#FFFFFF" width="1.75"
      position="0 0.1 0"
      animation="property: position; to: 0 0.13 0; dir: alternate; dur: 1600; loop: true; easing: easeInOutSine"></a-text>

    <!-- title -->
    <a-text value="SENIOR CONSULTANT" align="center" color="#22D3EE" width="1" position="0 0 0"></a-text>

    <!-- company / tagline -->
    <a-text value="FUTURE MUG   ·   TRUSTED EVALUATION PARTNER" align="center" color="#94A3B8" width="0.6"
      position="0 -0.1 0"></a-text>

    <!-- floating cube cluster (small "shattering" accent, like the reference) -->
    <a-entity mixin="cube" position="0.36 0.16 0.04"
      animation="property: rotation; to: 360 360 0; dur: 5000; loop: true; easing: linear"></a-entity>
    <a-entity mixin="cube" position="0.42 0.08 0.06" scale="0.7 0.7 0.7"
      animation="property: rotation; to: -360 180 360; dur: 6500; loop: true; easing: linear"></a-entity>
    <a-entity mixin="cube" position="0.38 -0.02 0.03" scale="1.3 1.3 1.3"
      animation="property: rotation; to: 180 -360 180; dur: 4200; loop: true; easing: linear"></a-entity>
    <a-entity mixin="cube" position="-0.4 0.14 0.05" scale="0.8 0.8 0.8"
      animation="property: rotation; to: 360 -180 270; dur: 5800; loop: true; easing: linear"></a-entity>
    <a-entity mixin="cube" position="-0.36 -0.05 0.04"
      animation="property: rotation; to: -270 360 90; dur: 4800; loop: true; easing: linear"></a-entity>

  </a-entity>
</a-scene>

<!-- Always-visible action buttons (not tracked — work as soon as the page loads) -->
<div id="contact-bar">
  <a href="tel:+919845200661">CALL</a>
  <a href="https://wa.me/919845200661">CHAT</a>
  <a href="mailto:sathya@futuremug.com">MAIL</a>
  <a href="contact.vcf" download>SAVE</a>
</div>

</body>
</html>
